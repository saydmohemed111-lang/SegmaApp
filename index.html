
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Segma</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:28px 15px;color:#e8c45b}
header h1{font-size:36px;margin:0}
header p{color:#aaa}
main{padding:15px 15px 100px;max-width:480px;margin:auto}
.card{background:#171717;border:1px solid #80652d;border-radius:16px;padding:22px;margin-bottom:16px;text-align:center}
.balance{font-size:32px;color:#edca67;font-weight:bold;margin:12px}
button{background:linear-gradient(90deg,#a77a25,#f1d47a);border:0;border-radius:12px;padding:14px 25px;font-weight:bold;font-size:16px;width:100%;color:#111}
nav{position:fixed;bottom:0;left:0;right:0;background:#151515;display:flex;justify-content:space-around;padding:15px 3px;border-top:1px solid #80652d}
nav span{font-size:12px;color:#e8c45b}
#loginStatus{color:#e8c45b;font-size:14px}
</style>
</head>

<body>
<header>
<h1>SEGMA</h1>
<p>MINE • HOLD • GROW</p>
</header>

<main>
<div class="card">
<h3 id="welcome">مرحباً بك في Segma</h3>
<p id="loginStatus">جاري التحقق من اتصال تيليجرام...</p>
</div>

<div class="card">
<p>رصيدك في Segma</p>
<div class="balance">0 SG</div>
<p>المستوى الحالي: 1</p>
</div>

<div class="card">
<h3>التعدين اليومي</h3>
<div class="balance">250 SG</div>
<p>مدة جلسة التعدين: 24 ساعة</p>
<button onclick="alert('سيتم تفعيل التعدين بعد تجهيز النظام')">ابدأ التعدين</button>
</div>

<div class="card">
<h3>مرحباً بك في Segma</h3>
<p>ابدأ رحلتك في عالم التعدين والمكافآت.</p>
</div>
</main>

<nav>
<span>الرئيسية</span>
<span>المهام</span>
<span>الإحالات</span>
<span>المحفظة</span>
<span>حسابي</span>
</nav>

<script>
const SUPABASE_URL = "https://fcrdywtlezabcbthkmtb.supabase.co";
const SUPABASE_KEY = "sb_publishable_0Rb6-MTCoKuApgeKRro2ow_mv1MqplC";
const SEGMA_API = SUPABASE_URL + "/functions/v1/segma-api";

window.segmaDB = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

console.log("Segma database client initialized");

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

async function verifyTelegram() {
  const status = document.getElementById("loginStatus");
  const welcome = document.getElementById("welcome");

  if (!tg.initData) {
    status.textContent = "افتح التطبيق من بوت Segma";
    return;
  }

  status.textContent = "جاري التحقق من حسابك...";

  try {
    const response = await fetch(SEGMA_API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        initData: tg.initData
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      status.textContent = "فشل التحقق من حساب تيليجرام";
      return;
    }

    welcome.textContent = "أهلاً " + (result.user.first_name || "بك");
    status.textContent = "تم التحقق من حساب تيليجرام بنجاح";
  } catch (error) {
    status.textContent = "تعذر الاتصال بالخادم، حاول مرة أخرى";
    console.error(error);
  }
}

verifyTelegram();
</script>

</body>
</html>
